[project]
name = "rx-system-pd"
version = "0.1.0"
description = "OMA-to-BER and photodiode receiver analysis tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "mypy>=2.1.0",
    "numpy>=2.4.5",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "scikit-rf>=1.12.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oma_ber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
